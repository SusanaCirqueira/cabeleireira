<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
<meta name="description" content="Jéssica Martins Exclusive Salon — salão especializado em cuidados capilares, coloração, cortes e tratamentos." />
<title>Jéssica Martins Exclusive Salon</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@300;400;500;600&display=swap');

  :root{
    --background: hsl(25 38% 9%);
    --foreground: hsl(36 32% 93%);
    --card: hsl(26 35% 12%);
    --primary: hsl(43 90% 58%);
    --primary-foreground: hsl(25 38% 9%);
    --secondary: hsl(28 33% 15%);
    --muted: hsl(28 30% 19%);
    --muted-foreground: hsl(32 14% 65%);
    --border: hsl(26 28% 28%);
    --destructive: hsl(0 70% 50%);
    --radius: 0.25rem;
    --font-heading: 'Playfair Display', Georgia, serif;
    --font-body: 'Playfair Display', Georgia, serif;
  }
  
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  
  body{
    background:var(--background);
    color:var(--foreground);
    font-family:var(--font-body);
    font-size:15px;
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }
  
  main#app {
    flex: 1;
  }

  @media(min-width: 768px){body{font-size:18px}}

  h1,h2,h3,h4{font-family:var(--font-heading);font-weight:400;letter-spacing:.05em;text-transform:uppercase}
  a{color:inherit;text-decoration:none}
  img{max-width:100%;height:auto;display:block}
  button{font-family:inherit;cursor:pointer}
  input,textarea,select{font-family:inherit}
  ::selection{background:var(--primary);color:var(--primary-foreground)}

  .gold-glow {
    color: var(--primary);
    text-shadow: 0 0 10px rgba(245, 197, 66, 0.35);
  }

  .wrap{width:100%;max-width:1280px;margin:0 auto;padding:0 16px}
  @media(min-width:768px){.wrap{padding:0 24px}}
  @media(min-width:1024px){.wrap{padding:0 40px}}

  .label-caps{text-transform:uppercase;letter-spacing:.15em;font-size:0.45rem !important;color:var(--muted-foreground);font-weight:500;font-family:'Inter',sans-serif;}
  @media(min-width:768px){.label-caps{font-size:0.5rem !important}}
  
  .gold{color:var(--primary)}
  .horizon-rule{height:1px;width:100%;background:var(--border)}
  .text-muted{color:var(--muted-foreground);font-family:'Inter',sans-serif;font-size:0.8rem;}
  .text-primary{color:var(--primary)}
  
  .btn-bronze{display:inline-flex;align-items:center;justify-content:center;background:var(--primary);color:var(--primary-foreground);padding:14px 20px;font-size:.8rem;text-transform:uppercase;letter-spacing:.15em;font-weight:600;transition:opacity .3s, box-shadow .3s;min-height:48px;border:0;font-family:'Inter',sans-serif;box-shadow:0 0 15px rgba(245, 197, 66, 0.3);width:100%}
  @media(min-width:640px){.btn-bronze{width:auto;padding:14px 24px;font-size:.875rem}}
  .btn-bronze:hover{opacity:.88;box-shadow:0 0 20px rgba(245, 197, 66, 0.5)}
  .btn-bronze:disabled{opacity:.4;cursor:not-allowed}
  
  .btn-white-solid{display:inline-flex;align-items:center;justify-content:center;gap:12px;background:#ffffff !important;color:#1a1512 !important;padding:14px 20px;font-size:.8rem;text-transform:uppercase;letter-spacing:.15em;font-weight:600;transition:opacity .3s, transform .3s;min-height:48px;border:0;font-family:'Inter',sans-serif;width:100%; color-scheme: normal !important;}
  @media(min-width:640px){.btn-white-solid{width:auto;padding:14px 24px;font-size:.875rem}}
  .btn-white-solid:hover{opacity:.9;transform:translateY(-2px)}

  .btn-outline{display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--foreground);color:var(--foreground);background:transparent;padding:14px 20px;font-size:.8rem;text-transform:uppercase;letter-spacing:.15em;font-weight:600;transition:all .3s;min-height:48px;font-family:'Inter',sans-serif;width:100%}
  @media(min-width:640px){.btn-outline{width:auto;padding:14px 24px;font-size:.875rem}}
  .btn-outline:hover{background:var(--foreground);color:var(--background)}
  
  .scale-hover{transition:transform .7s cubic-bezier(.22,1,.36,1)}
  .scale-hover:hover{transform:scale(1.03)}

  .grid-2-buttons{
    display:grid;
    grid-template-columns:1fr;
    gap:16px;
    max-width:450px;
    margin:0 auto; 
    width: 100%;
  }
  @media(min-width:640px){
    .grid-2-buttons{
      grid-template-columns:repeat(2, 1fr);
      max-width:850px;
    }
  }
  
  .big-nav-btn{
    min-height:90px;
    background:var(--secondary);
    border:1px solid var(--border);
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:var(--font-heading);
    font-size:1.1rem;
    letter-spacing:.2em;
    text-transform:uppercase;
    color:var(--foreground);
    transition:all .3s ease;
    text-align:center;
    padding:18px 24px; 
    width: 100%;
  }
  @media(min-width:768px){.big-nav-btn{font-size:1.25rem;min-height:100px}}
  .big-nav-btn:hover{background:var(--primary);color:var(--primary-foreground);border-color:var(--primary);transform:translateY(-3px);box-shadow: 0 0 20px rgba(245, 197, 66, 0.45);}

  header.nav{position:fixed;top:0;left:0;right:0;z-index:50;background:var(--secondary);backdrop-filter:blur(6px);border-bottom:1px solid var(--border);transition:all .5s}
  
  header.nav .nav-inner{
    max-width:100%;
    margin:0 auto;
    padding:0 16px;
    height:85px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    position:relative;
  }
  @media(min-width:768px){header.nav .nav-inner{padding:0 24px;}}
  @media(min-width:1024px){header.nav .nav-inner{padding:0 40px;height:105px}}
  
  .nav-left{
    display:flex;
    align-items:center;
    gap:8px;
    position:absolute;
    left:16px;
  }
  @media(min-width:768px){.nav-left{left:24px;}}
  @media(min-width:1024px){.nav-left{left:40px;}}
  
  .back-btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    background:none;
    border:0;
    color:var(--primary);
    padding:2px;
    transition:opacity .3s;
  }
  .back-btn:hover{opacity:0.7}
  
  .brand-link {
    display: inline-flex;
    align-items: center;
  }

  .brand-logo{width:200px;height:auto;display:block;object-fit:contain;filter: drop-shadow(0 0 10px rgba(245, 197, 66, 0.3));}
  @media(min-width:768px){.brand-logo{width:320px}}

  .nav-right{
    display:flex;
    align-items:center;
    gap:4px;
    color:var(--primary);
    margin-left:auto;
  }
  @media(min-width:768px){.nav-right{gap:12px}}
  
  .nav-cart-icon{display:inline-flex;align-items:center;justify-content:center;color:var(--primary);transition:color .3s;padding:8px}
  .burger{display:flex;background:none;border:0;color:var(--primary);padding:8px}

  .mobile-menu{display:none;position:fixed;top:85px;right:0;width:100%;background:var(--secondary);border-left:1px solid var(--border);border-bottom:1px solid var(--border);box-shadow:0 10px 30px rgba(0,0,0,0.5);z-index:100;animation:fadeInDown .3s ease;max-height:calc(100vh - 85px);overflow-y:auto}
  @media(min-width:640px){.mobile-menu{max-width:420px;top:105px;max-height:calc(100vh - 105px)}}
  .mobile-menu.open{display:block}
  .mobile-menu .mm-inner{padding:20px;display:flex;flex-direction:column;gap:16px}
  .mobile-menu h3{font-size:1.15rem;letter-spacing:.2em;text-transform:uppercase;margin-bottom:4px}
  .mobile-menu ul{list-style:none}
  .mobile-menu ul li{margin-bottom:8px;font-size:.85rem}
  @keyframes fadeInDown{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:translateY(0)}}

  .hero{position:relative;height:calc(100vh - 85px);min-height:400px;margin-top:85px;display:flex;flex-direction:column;justify-content:flex-start;overflow:hidden}
  @media(min-width:1024px){.hero{height:calc(100vh - 105px);margin-top:105px}}
  
  .hero-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter: blur(1.5px);transform: scale(1.01);}
  .hero-overlay{position:absolute;inset:0;background:linear-gradient(to bottom, rgba(0,0,0,.4), rgba(0,0,0,.4))}
  
  .hero-content{position:relative;z-index:10;width:100%;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;text-align:center;padding-top:32vh;}
  @media(min-width:768px){.hero-content{padding-top:36vh;}}
  
  .hero h1{font-size:clamp(2.80rem, 8.5vw, 6.5rem);line-height:1.1;text-transform:uppercase;padding:0 8px;}
  
  .hero-bounce{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);z-index:10;color:rgba(255,255,255,.7);animation:bounce 2s infinite}
  @keyframes bounce{0%,100%{transform:translateX(-50%) translateY(0)}50%{transform:translateX(-50%) translateY(6px)}}

  .fullscreen-section {
    min-height: 100vh;
    height: auto;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 120px 16px;
    width: 100%;
    box-sizing: border-box;
    background: var(--background);
  }
  @media(min-width: 1024px) {
    .fullscreen-section {
      min-height: 100vh;
      padding: 140px 16px;
    }
  }

  .testimonial-section {
    min-height: auto !important;
    padding: 40px 16px 80px 16px !important;
    background: var(--background) !important;
  }
  @media(min-width: 1024px) {
    .testimonial-section {
      padding: 50px 16px 100px 16px !important;
    }
  }

  .hero-welcome-box {
    max-width: 900px; 
    margin: 0 auto; 
    text-align: center;
  }
  .hero-welcome-box h2 {
    margin-top: 16px;       
    margin-bottom: 24px;    
    font-size: clamp(1.8rem, 3.8vw, 3.2rem);
    line-height: 1.2;
  }
  .hero-welcome-box p {
    margin-bottom: 16px;
    line-height: 1.7;
    font-size: clamp(1rem, 2vw, 1.35rem);
  }
  .hero-welcome-btn-wrap {
    margin-top: 32px;       
    display: flex; 
    justify-content: center; 
  }

  .sec{padding:40px 0}
  @media(min-width:768px){.sec{padding:70px 0}}
  
  .sec-head{max-width:42rem;margin:0 auto 24px;text-align:center;padding:0 12px}
  @media(min-width:768px){.sec-head{margin:0 auto 32px}}
  .sec-head h2{font-size:clamp(1.6rem,3.5vw,2.8rem);letter-spacing:.05em;line-height:1.15;margin-top:0px}
  .sec-head p{margin-top:6px;color:var(--muted-foreground);line-height:1.5;font-size:0.8rem}
  @media(min-width:768px){.sec-head p{font-size:0.9rem}}

  .tag-badge {
    display: inline-block;
    padding: 8px 18px;
    border: 1px solid var(--border);
    background: var(--secondary);
    color: var(--foreground);
    border-radius: 20px;
    font-size: 0.8rem;
    letter-spacing: 0.08em;
    font-family: 'Inter', sans-serif;
    cursor: pointer;
    transition: all 0.3s ease;
    user-select: none;
  }
  .tag-badge:hover, .tag-badge.active {
    border-color: var(--primary);
    background: var(--primary);
    color: var(--primary-foreground);
    font-weight: 600;
    box-shadow: 0 0 12px rgba(245, 197, 66, 0.4);
  }

  .grid-prod {
    display: grid;
    grid-template-columns: 1fr;
    gap: 24px;
    margin-top: 24px;
  }
  @media(min-width: 640px) {
    .grid-prod { grid-template-columns: repeat(2, 1fr); }
  }
  @media(min-width: 1024px) {
    .grid-prod { grid-template-columns: repeat(3, 1fr); }
  }

  .testimonial-slider-container {
    max-width: 860px;
    margin: 0 auto;
    position: relative;
    padding: 0 10px;
  }
  
  .tst {
    border: 1px solid var(--border);
    padding: 40px 70px;
    background: var(--secondary);
    text-align: center;
    border-radius: var(--radius);
    box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    height: 390px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    position: relative;
  }
  @media(min-width:768px){
    .tst{
      height: 440px;
      padding: 50px 100px;
    }
  }

  .tst .stars{display:flex;justify-content:center;gap:4px;margin-bottom:16px}
  .tst .stars svg{fill:var(--primary);color:var(--primary);filter: drop-shadow(0 0 5px rgba(245, 197, 66, 0.5));}
  .tst p{color:var(--muted-foreground);line-height:1.6;margin-bottom:20px;font-style:italic;font-size:1.1rem}
  @media(min-width:768px){.tst p{font-size:1.35rem}}
  .tst .who{font-family:var(--font-heading);letter-spacing:.05em;font-size:1.2rem}
  
  .tst-arrow-right {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    background: none;
    border: none;
    color: var(--primary);
    cursor: pointer;
    transition: opacity 0.3s ease, transform 0.3s ease;
    z-index: 10;
    padding: 10px;
  }
  .tst-arrow-right:hover {
    opacity: 0.7;
    transform: translateY(-50%) scale(1.1);
  }
  .tst-next { right: 12px; }
  @media(min-width:768px){
    .tst-next { right: 24px; }
  }

  .prof-slider {
    position: relative;
    width: 100%;
    max-width: 860px;
    height: 440px;
    overflow: hidden;
    background: var(--secondary);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    margin: 0 auto;
    box-shadow: 0 10px 30px rgba(0,0,0,0.3);
  }
  @media(min-width:768px){
    .prof-slider{
      max-width: 860px;
      height: 500px;
    }
  }
  .prof-slider img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    opacity: 0;
    transition: opacity 0.5s ease-in-out;
  }
  .prof-slider img.active {
    opacity: 1;
  }

  .prof-arrow {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    background: none;
    border: none;
    color: var(--primary);
    cursor: pointer;
    transition: opacity 0.3s ease, transform 0.3s ease;
    z-index: 10;
    padding: 10px;
  }
  .prof-arrow:hover {
    opacity: 0.7;
    transform: translateY(-50%) scale(1.1);
  }
  .prof-prev { left: 12px; }
  .prof-next { right: 12px; }
  @media(min-width:768px){
    .prof-prev { left: 24px; }
    .prof-next { right: 24px; }
  }

  .prod{display:flex;flex-direction:column;background:var(--secondary);border:1px solid var(--border);padding:16px;border-radius:var(--radius)}
  .prod .prod-img{background:var(--secondary);aspect-ratio:4/3;overflow:hidden;margin-bottom:12px;border-radius:var(--radius)}
  .prod .prod-img img{width:100%;height:100%;object-fit:cover}
  .prod h3{font-size:1.15rem;line-height:1.3;margin-bottom:4px}
  .prod .brand{font-size:.7rem;color:var(--muted-foreground);margin-bottom:6px;font-family:'Inter',sans-serif;}
  .prod .desc{font-size:.8rem;color:var(--muted-foreground);margin-bottom:12px;flex:1;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;font-family:'Inter',sans-serif;}
  .prod .foot{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:auto}
  .prod .price{font-family:var(--font-heading);font-size:1.2rem}
  .prod .add-btn{display:inline-flex;align-items:center;justify-content:center;padding:8px 14px;font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--primary-foreground);background:var(--primary);border:0;transition:all .3s;font-family:'Inter',sans-serif;font-weight:600;box-shadow: 0 0 10px rgba(245, 197, 66, 0.3);border-radius:var(--radius);}
  .prod .add-btn:hover{opacity:0.9;box-shadow: 0 0 15px rgba(245, 197, 66, 0.5);}

  .cart-container {
    max-width: 850px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 30px;
    padding-top: 10px;
  }
  
  .cart-row {
    display: flex;
    flex-direction: column;
    gap: 20px;
    padding: 24px;
    background: var(--secondary);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    margin-bottom: 20px;
  }
  @media(min-width: 560px) {
    .cart-row {
      flex-direction: row;
      align-items: center;
      gap: 24px;
      padding: 24px 28px;
    }
  }
  
  .cart-row .ci-img {
    width: 100%;
    height: 160px;
    background: var(--secondary);
    overflow: hidden;
    border-radius: var(--radius);
    flex-shrink: 0;
  }
  @media(min-width: 560px) {
    .cart-row .ci-img {
      width: 120px;
      height: 120px;
    }
  }
  .cart-row .ci-img img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  
  .cart-row-content {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .cart-row-content .desc {
    font-family: 'Inter', sans-serif;
    font-size: 0.85rem;
    color: var(--muted-foreground);
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .qty{display:flex;align-items:center;gap:8px;margin-top:8px}
  .qty button{width:32px;height:32px;border:1px solid var(--border);background:transparent;color:var(--foreground);display:flex;align-items:center;justify-content:center}
  
  .ci-right {
    display: flex;
    flex-direction: row;
    justify-content: space-between;
    align-items: center;
    width: 100%;
    margin-top: 8px;
    padding-top: 16px;
    border-top: 1px solid var(--border);
  }
  @media(min-width: 560px) {
    .ci-right {
      flex-direction: column;
      align-items: flex-end;
      width: auto;
      margin-top: 0;
      padding-top: 0;
      border-top: none;
      gap: 12px;
    }
  }
  
  .ci-right .price {
    font-family: var(--font-heading);
    font-size: 1.35rem;
  }

  .ci-remove-btn {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--muted-foreground);
    width: 40px;
    height: 40px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border-radius: var(--radius);
    transition: all 0.3s ease;
    cursor: pointer;
  }
  .ci-remove-btn:hover {
    background: var(--destructive);
    border-color: var(--destructive);
    color: #ffffff;
    box-shadow: 0 0 10px rgba(255, 0, 0, 0.3);
  }
  
  .summary {
    background: var(--secondary);
    border: 1px solid var(--border);
    padding: 32px;
    border-radius: var(--radius);
    text-align: center;
    margin-top: 16px;
  }
  @media(min-width: 768px){
    .summary {
      padding: 40px;
    }
  }
  
  .summary .total-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin: 20px 0 28px;
  }
  .summary .total-row .t {
    font-family: var(--font-heading);
    font-size: 1.6rem;
  }
  .summary .btn-full {
    width: 100%;
    margin-bottom: 14px;
  }
  
  .empty-cart{padding:80px 0 60px;text-align:center}
  @media(min-width:768px){.empty-cart{padding:160px 0 128px}}
  .empty-cart .ec-inner{max-width:28rem;margin:0 auto;padding:0 16px}

  footer{background:var(--secondary);border-top:1px solid var(--border);margin-top:auto;}
  .foot-bottom{text-align:center;padding:24px 20px;display:flex;justify-content:center;align-items:center;}
  .foot-logo{width:50px;height:auto;display:block;object-fit:contain;filter: drop-shadow(0 0 8px rgba(245, 197, 66, 0.3));}

  .page{padding-top:130px;padding-bottom:60px}
  @media(min-width:768px){.page{padding-top:175px;padding-bottom:100px}}
</style>
</head>
<body>

<header class="nav" id="navbar">
  <div class="nav-inner">
    <div class="nav-left">
      <button class="back-btn" id="backBtn" onclick="goBack()" aria-label="Voltar" style="display: none;">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
      </button>
      <a href="#/" class="brand-link">
        <img src="logo.png" alt="Jéssica Martins Logo" class="brand-logo">
      </a>
    </div>
    <div class="nav-right">
      <a href="#/carrinho" class="nav-cart-icon" id="navCartIcon" data-route="/carrinho" aria-label="Carrinho" style="display: none;">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>

function changeProfPhoto(profId, direction) {
  const prof = PROFESSIONALS.find(p => p.id === profId);
  if (!prof || !prof.photos || prof.photos.length === 0) return;
  
  profPhotoIndexes[profId] += direction;
  if (profPhotoIndexes[profId] < 0) {
    profPhotoIndexes[profId] = prof.photos.length - 1;
  } else if (profPhotoIndexes[profId] >= prof.photos.length) {
    profPhotoIndexes[profId] = 0;
  }
  
  updateProfPhotoDisplay(profId);
}

function updateProfPhotoDisplay(profId) {
  const container = document.getElementById('prof-slider-' + profId);
  if (container) {
    const imgs = container.querySelectorAll('img');
    imgs.forEach((img, idx) => {
      if (idx === profPhotoIndexes[profId]) {
        img.classList.add('active');
      } else {
        img.classList.remove('active');
      }
    });
  }
}

const STORAGE_KEY = "jm_cart_v2";
let cart = [];

function saveCart(){ 
  localStorage.setItem(STORAGE_KEY, JSON.stringify(cart)); 
}

function parsePrice(p) {
  if (typeof p === 'number') return p;
  return parseFloat(String(p).replace('R$', '').replace('.', '').replace(',', '.').trim()) || 0;
}

function cartTotal(){ 
  return cart.reduce((s, i) => {
    if (i.type === 'product') return s + (i.price * i.quantity);
    return s + parsePrice(i.price);
  }, 0); 
}

function addServiceToCartDirect(serviceId){
  const service = SERVICES.find(s => s.id === serviceId);
  if(!service) return;
  cart.push({
    cartId: 'svc_'+Date.now()+'_'+Math.random().toString(36).slice(2,7),
    type:'service', id:service.id, name:service.name, description:service.description, price:service.price, image:service.image,
    professional: '', date: '', time: '', notes: ''
  });
  saveCart();
  toast('Procedimento adicionado ao carrinho!');
}

function addProductToCart(product){
  const ex = cart.find(i => i.type === 'product' && i.id === product.id);
  if(ex){ 
    ex.quantity++; 
  } else {
    cart.push({
      cartId: 'prd_'+Date.now()+'_'+Math.random().toString(36).slice(2,7),
      type:'product', id:product.id, name:product.name, brand:product.brand, description:product.description, price:product.price, image:product.image, quantity:1
    });
  }
  saveCart(); 
  toast('Produto adicionado ao carrinho');
}

function updateProductQty(cartId, qty){
  const it = cart.find(i => i.cartId === cartId); 
  if(it){ 
    it.quantity = Math.max(1, qty); 
    saveCart(); 
    if(currentRoute === '/carrinho') render(); 
  }
}

function removeCartItem(cartId){ 
  cart = cart.filter(i => i.cartId !== cartId); 
  saveCart(); 
  if(currentRoute === '/carrinho') render(); 
}

function clearCartAll(){ 
  cart = []; 
  saveCart(); 
  if(currentRoute === '/carrinho') render(); 
}

let toastTimer;
function toast(msg){
  let t = document.getElementById('toast');
  if(!t){ t = document.createElement('div'); t.id='toast'; t.style.cssText='position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--primary);color:var(--primary-foreground);padding:10px 20px;font-size:.8rem;font-weight:600;opacity:0;transition:.3s;z-index:200;font-family:Inter,sans-serif;box-shadow:0 0 15px rgba(245, 197, 66, 0.4);'; document.body.appendChild(t); }
  t.textContent = msg; t.style.opacity='1'; t.style.transform='translateX(-50%) translateY(0)';
  clearTimeout(toastTimer); toastTimer = setTimeout(()=>{ t.style.opacity='0'; t.style.transform='translateX(-50%) translateY(20px)'; }, 2200);
}

  const cartIcon = document.getElementById('navCartIcon');
