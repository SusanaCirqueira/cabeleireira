<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="description" content="Jéssica Martins · Exclusive Salon — salão especializado em cuidados capilares. Coloração, cortes, tratamentos, alisamento, penteados e mega hair com atendimento personalizado." />
<title>Jéssica Martins · Exclusive Salon</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Tenor+Sans&family=Inter:wght@300;400;500;600&display=swap');

  :root{
    --background: hsl(25 38% 9%);
    --foreground: hsl(36 32% 93%);
    --card: hsl(26 35% 12%);
    --primary: hsl(46 68% 47%);
    --primary-foreground: hsl(25 38% 9%);
    --secondary: hsl(28 33% 15%);
    --muted: hsl(28 30% 19%);
    --muted-foreground: hsl(32 14% 65%);
    --border: hsl(26 28% 28%);
    --destructive: hsl(0 70% 50%);
    --radius: 0.25rem;
    --font-heading: 'Tenor Sans', ui-sans-serif, system-ui, sans-serif;
    --font-body: 'Inter', ui-sans-serif, system-ui, sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{background:var(--background);color:var(--foreground);font-family:var(--font-body);font-size:18px;line-height:1.6;-webkit-font-smoothing:antialiased}
  h1,h2,h3,h4{font-family:var(--font-heading);font-weight:400;letter-spacing:.05em}
  a{color:inherit;text-decoration:none}
  img{max-width:100%;display:block}
  button{font-family:inherit;cursor:pointer}
  input,textarea,select{font-family:inherit}
  ::selection{background:var(--primary);color:var(--primary-foreground)}

  .wrap{max-width:1280px;margin:0 auto;padding:0 24px}
  @media(min-width:1024px){.wrap{padding:0 40px}}
  .label-caps{text-transform:uppercase;letter-spacing:.15em;font-size:.75rem;color:var(--muted-foreground);font-weight:500}
  .gold{color:var(--primary)}
  .horizon-rule{height:1px;width:100%;background:var(--border)}
  .text-muted{color:var(--muted-foreground)}
  .text-primary{color:var(--primary)}
  .bg-secondary-50{background:color-mix(in srgb, var(--secondary) 50%, transparent)}
  .bg-secondary-60{background:color-mix(in srgb, var(--secondary) 60%, transparent)}
  .border-b{border-bottom:1px solid var(--border)}
  .border-t{border-top:1px solid var(--border)}
  .border{border:1px solid var(--border)}

  .btn-bronze{display:inline-flex;align-items:center;justify-content:center;background:var(--primary);color:var(--primary-foreground);padding:16px 32px;font-size:.875rem;text-transform:uppercase;letter-spacing:.15em;font-weight:500;transition:opacity .3s;min-height:48px;border:0}
  .btn-bronze:hover{opacity:.88}
  .btn-bronze:disabled{opacity:.4;cursor:not-allowed}
  .btn-outline{display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--foreground);color:var(--foreground);background:transparent;padding:16px 32px;font-size:.875rem;text-transform:uppercase;letter-spacing:.15em;font-weight:500;transition:all .3s;min-height:48px}
  .btn-outline:hover{background:var(--foreground);color:var(--background)}
  .btn-outline-white{border-color:#fff;color:#fff}
  .btn-outline-white:hover{background:#fff;color:var(--background)}
  .link-arrow{display:inline-flex;align-items:center;gap:8px;font-size:.875rem;text-transform:uppercase;letter-spacing:.15em;color:var(--primary);transition:color .3s}
  .link-arrow:hover{color:var(--foreground)}
  .scale-hover{transition:transform .7s cubic-bezier(.22,1,.36,1)}
  .scale-hover:hover{transform:scale(1.03)}

  /* NAVBAR */
  header.nav{position:fixed;top:0;left:0;right:0;z-index:50;transition:all .5s}
  header.nav.scrolled{background:color-mix(in srgb, var(--background) 95%, transparent);backdrop-filter:blur(6px);border-bottom:1px solid var(--border)}
  header.nav .nav-inner{max-width:1280px;margin:0 auto;padding:0 24px;height:80px;display:flex;align-items:center;justify-content:space-between}
  @media(min-width:1024px){header.nav .nav-inner{padding:0 40px}}
  .brand{display:flex;align-items:center;text-decoration:none}
  .brand-logo{height:48px;width:auto;object-fit:contain}
  .nav-links{display:none;align-items:center;gap:40px}
  .nav-links a{font-size:.875rem;text-transform:uppercase;letter-spacing:.15em;color:color-mix(in srgb, var(--foreground) 70%, transparent);transition:color .3s}
  .nav-links a:hover,.nav-links a.active{color:var(--foreground)}
  .nav-links a.active{color:var(--primary)}
  .nav-right{display:flex;align-items:center;gap:16px}
  .cart-link{position:relative;padding:8px;color:var(--foreground);transition:color .3s}
  .cart-link:hover{color:var(--primary)}
  .cart-count{position:absolute;top:-2px;right:-2px;background:var(--primary);color:var(--primary-foreground);font-size:10px;font-weight:600;border-radius:50%;width:20px;height:20px;display:flex;align-items:center;justify-content:center}
  .burger{display:flex;background:none;border:0;color:var(--foreground);padding:8px}
  .mobile-menu{display:none;background:var(--background);border-top:1px solid var(--border)}
  .mobile-menu.open{display:block}
  .mobile-menu .mm-inner{padding:24px;display:flex;flex-direction:column;gap:20px}
  .mobile-menu a{font-size:.875rem;text-transform:uppercase;letter-spacing:.15em;color:color-mix(in srgb,var(--foreground) 80%,transparent)}
  .mobile-menu a.active{color:var(--primary)}
  @media(min-width:768px){.nav-links{display:flex}.burger{display:none}}

  /* HERO */
  .hero{position:relative;height:100vh;min-height:600px;display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden}
  .hero-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .hero-overlay{position:absolute;inset:0;background:linear-gradient(to bottom, rgba(0,0,0,.2), transparent, rgba(0,0,0,.4))}
  .hero-content{position:relative;z-index:10;width:100%;padding-bottom:80px}
  .hero h1{color:#fff;font-size:clamp(3rem,7vw,4.5rem);line-height:1.05;max-width:36rem}
  .hero .btn-row{display:flex;flex-wrap:wrap;gap:16px}
  .hero-bounce{position:absolute;bottom:24px;left:50%;transform:translateX(-50%);z-index:10;color:rgba(255,255,255,.7);animation:bounce 2s infinite}
  @keyframes bounce{0%,100%{transform:translateX(-50%) translateY(0)}50%{transform:translateX(-50%) translateY(8px)}}

  /* SECTIONS */
  section{padding:0}
  .sec{padding:96px 0}
  @media(min-width:768px){.sec{padding:128px 0}}
  .sec-head{max-width:42rem;margin:0 auto 56px;text-align:center}
  .sec-head h2{font-size:clamp(1.875rem,4vw,3rem);letter-spacing:.05em;line-height:1.1;margin-top:16px}
  .sec-head p{margin-top:20px;color:var(--muted-foreground);line-height:1.6}
  .sec-head.left{text-align:left;margin-left:0}

  /* GRIDS */
  .grid-2{display:grid;grid-template-columns:1fr;gap:64px;align-items:center}
  @media(min-width:768px){.grid-2{grid-template-columns:1fr 1fr}}
  .grid-3{display:grid;grid-template-columns:1fr;gap:32px}
  @media(min-width:768px){.grid-3{grid-template-columns:repeat(3,1fr)}}
  .grid-4{display:grid;grid-template-columns:repeat(2,1fr);gap:32px}
  @media(min-width:768px){.grid-4{grid-template-columns:repeat(4,1fr)}}
  .grid-prod{display:grid;grid-template-columns:repeat(2,1fr);gap:32px}
  @media(min-width:768px){.grid-prod{grid-template-columns:repeat(3,1fr)}}
  @media(min-width:1024px){.grid-prod{grid-template-columns:repeat(4,1fr)}}

  .aspect-45{aspect-ratio:4/5}
  .aspect-34{aspect-ratio:3/4}
  .aspect-43{aspect-ratio:4/3}
  .aspect-1{aspect-ratio:1}
  .overflow-hidden{overflow:hidden}
  .obj-cover{width:100%;height:100%;object-fit:cover}

  /* SERVICE CARD */
  .svc-card{display:block}
  .svc-card .img-wrap{aspect-ratio:3/4;overflow:hidden;margin-bottom:20px;background:var(--secondary)}
  .svc-card .img-wrap img{width:100%;height:100%;object-fit:cover}

  /* BEFORE AFTER */
  .ba{position:relative;overflow:hidden}
  .ba .ba-frame{aspect-ratio:3/4;position:relative}
  .ba .ba-frame img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:opacity .7s}
  .ba .ba-bar{position:absolute;bottom:0;left:0;right:0;padding:16px;display:flex;justify-content:center;background:linear-gradient(to top, rgba(0,0,0,.4), transparent)}
  .ba .ba-btn{font-size:.75rem;text-transform:uppercase;letter-spacing:.15em;color:#fff;background:rgba(0,0,0,.3);backdrop-filter:blur(4px);padding:8px 20px;border:0;transition:background .3s}
  .ba .ba-btn:hover{background:rgba(0,0,0,.5)}

  /* TESTIMONIAL */
  .tst{border:1px solid var(--border);padding:32px}
  .tst .stars{display:flex;gap:4px;margin-bottom:16px}
  .tst .stars svg{fill:var(--primary);color:var(--primary)}
  .tst p{color:var(--muted-foreground);line-height:1.6;margin-bottom:24px;font-style:italic}
  .tst .who{font-family:var(--font-heading);letter-spacing:.05em}

  /* CTA */
  .cta{position:relative;padding:128px 0;overflow:hidden;text-align:center}
  .cta .cta-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .cta .cta-overlay{position:absolute;inset:0;background:rgba(0,0,0,.5)}
  .cta .cta-content{position:relative;z-index:10;max-width:48rem;margin:0 auto;padding:0 24px;color:#fff}
  .cta h2{font-size:clamp(1.875rem,4vw,3rem);margin-bottom:24px}
  .cta p{color:rgba(255,255,255,.8);margin-bottom:40px}

  /* ABOUT */
  .diff-grid{display:grid;grid-template-columns:1fr;gap:32px}
  @media(min-width:640px){.diff-grid{grid-template-columns:repeat(2,1fr)}}
  @media(min-width:1024px){.diff-grid{grid-template-columns:repeat(4,1fr)}}
  .diff{text-align:center}
  .diff .diff-ico{width:56px;height:56px;margin:0 auto 20px;border-radius:50%;background:var(--background);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;color:var(--primary)}
  .diff h3{font-size:1.125rem;margin-bottom:12px}
  .diff p{font-size:.875rem;color:var(--muted-foreground);line-height:1.6}

  /* PROCEDURES ACCORDION */
  .acc-item{border-bottom:1px solid var(--border)}
  .acc-head{width:100%;display:flex;align-items:center;justify-content:space-between;padding:32px 0;background:none;border:0;text-align:left;color:var(--foreground)}
  .acc-head .acc-num{font-size:1.5rem;color:var(--primary);font-family:var(--font-heading);width:32px}
  .acc-head h3{font-size:clamp(1.5rem,3vw,1.875rem)}
  .acc-head .acc-count{font-size:.875rem;color:var(--muted-foreground)}
  .acc-body{padding-bottom:40px;display:none;flex-direction:column;gap:32px}
  .acc-body.open{display:flex}
  .svc-detail{display:grid;gap:32px;align-items:start;border-top:1px solid var(--border);padding-top:32px}
  @media(min-width:768px){.svc-detail{grid-template-columns:1fr 1fr}}
  .svc-detail .svc-imgbox{aspect-ratio:3/4;overflow:hidden}
  @media(min-width:768px){.svc-detail .svc-imgbox{aspect-ratio:4/3}}
  .svc-detail .svc-imgbox img{width:100%;height:100%;object-fit:cover}
  .svc-detail h4{font-size:1.5rem;margin-bottom:16px}
  .svc-detail .meta{display:flex;flex-wrap:wrap;gap:24px;margin-bottom:24px;font-size:.875rem;align-items:center}
  .svc-detail .meta .price{font-family:var(--font-heading);font-size:1.125rem}

  /* SHOP CONTROLS */
  .shop-tools{display:flex;flex-direction:column;gap:24px;margin-bottom:48px}
  @media(min-width:768px){.shop-tools{flex-direction:row;justify-content:space-between;align-items:center}}
  .search-wrap{position:relative;flex:1}
  .search-wrap svg{position:absolute;left:16px;top:50%;transform:translateY(-50%);color:var(--muted-foreground)}
  .search-wrap input{width:100%;background:var(--secondary);border:1px solid var(--border);padding:12px 16px 12px 44px;font-size:.875rem;color:var(--foreground);outline:none}
  .search-wrap input:focus{border-color:var(--primary)}
  .cats{display:flex;gap:8px;flex-wrap:wrap}
  .cat-btn{font-size:.75rem;text-transform:uppercase;letter-spacing:.15em;padding:12px 16px;border:1px solid var(--border);background:transparent;color:var(--foreground);transition:all .3s;white-space:nowrap}
  .cat-btn:hover{border-color:var(--primary)}
  .cat-btn.active{background:var(--primary);color:var(--primary-foreground);border-color:var(--primary)}

  /* PRODUCT CARD */
  .prod{display:flex;flex-direction:column}
  .prod .prod-img{background:var(--secondary);aspect-ratio:4/5;overflow:hidden;margin-bottom:20px}
  .prod .prod-img img{width:100%;height:100%;object-fit:cover}
  .prod h3{font-size:1.125rem;line-height:1.3;margin-bottom:4px}
  .prod .brand{font-size:.75rem;color:var(--muted-foreground);margin-bottom:12px}
  .prod .desc{font-size:.875rem;color:var(--muted-foreground);margin-bottom:16px;flex:1;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .prod .foot{display:flex;align-items:center;justify-content:space-between}
  .prod .price{font-family:var(--font-heading);font-size:1.125rem}
  .prod .add-btn{display:inline-flex;align-items:center;gap:8px;font-size:.75rem;text-transform:uppercase;letter-spacing:.15em;color:var(--primary);background:none;border:0;min-height:48px;transition:color .3s}
  .prod .add-btn:hover{color:var(--foreground)}

  /* CART */
  .cart-grid{display:grid;grid-template-columns:1fr;gap:48px}
  @media(min-width:1024px){.cart-grid{grid-template-columns:2fr 1fr}}
  .cart-section h2{font-size:1.5rem;margin-bottom:24px;padding-bottom:16px;border-bottom:1px solid var(--border)}
  .cart-row{display:flex;justify-content:space-between;gap:16px;padding-bottom:24px;border-bottom:1px solid var(--border);margin-bottom:24px}
  .cart-row .ci-img{width:80px;height:96px;background:var(--secondary);overflow:hidden;flex-shrink:0}
  .cart-row .ci-img img{width:100%;height:100%;object-fit:cover}
  .qty{display:flex;align-items:center;gap:12px;margin-top:12px}
  .qty button{width:36px;height:36px;border:1px solid var(--border);background:transparent;color:var(--foreground);display:flex;align-items:center;justify-content:center;transition:border-color .3s}
  .qty button:hover{border-color:var(--primary)}
  .ci-right{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
  .ci-right .price{font-family:var(--font-heading)}
  .ci-remove{color:var(--muted-foreground);background:none;border:0;transition:color .3s}
  .ci-remove:hover{color:var(--destructive)}
  .summary{background:color-mix(in srgb,var(--secondary) 50%,transparent);border:1px solid var(--border);padding:32px;position:sticky;top:112px}
  .summary .sum-row{display:flex;justify-content:space-between;font-size:.875rem;color:var(--muted-foreground);margin-bottom:12px}
  .summary .sum-row span:first-child{flex:1;margin-right:8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .summary .total-row{display:flex;justify-content:space-between;align-items:center;margin:24px 0 32px}
  .summary .total-row .t{font-family:var(--font-heading);font-size:1.5rem}
  .summary input{width:100%;background:var(--background);border:1px solid var(--border);padding:12px 16px;font-size:.875rem;color:var(--foreground);outline:none}
  .summary input:focus{border-color:var(--primary)}
  .summary .btn-full{width:100%;margin-bottom:12px}
  .empty-cart{padding:160px 0 128px;text-align:center}
  .empty-cart .ec-inner{max-width:28rem;margin:0 auto;padding:0 24px}

  /* CONTACT */
  .contact-grid{display:grid;grid-template-columns:1fr;gap:64px}
  @media(min-width:768px){.contact-grid{grid-template-columns:1fr 1fr}}
  .form-field{margin-bottom:24px}
  .form-field label{display:block;margin-bottom:8px}
  .form-field input,.form-field textarea{width:100%;background:var(--secondary);border:1px solid var(--border);padding:12px 16px;font-size:.875rem;color:var(--foreground);outline:none}
  .form-field input:focus,.form-field textarea:focus{border-color:var(--primary)}
  .form-field textarea{resize:none}
  .ci-info{display:flex;gap:16px;margin-bottom:24px}
  .ci-info .ico{color:var(--primary);flex-shrink:0;margin-top:4px}
  .ci-info .ci-label{margin-bottom:4px}
  .social-row{display:flex;gap:16px;margin-bottom:40px}
  .social-row a{border:1px solid var(--border);padding:16px;transition:border-color .3s;color:var(--foreground)}
  .social-row a:hover{border-color:var(--primary)}
  .map-box{aspect-ratio:4/3;overflow:hidden;border:1px solid var(--border)}
  .map-box iframe{width:100%;height:100%;border:0;filter:grayscale(.3)}

  /* FOOTER */
  footer{background:color-mix(in srgb,var(--secondary) 60%,transparent);border-top:1px solid var(--border);margin-top:96px}
  .foot-grid{display:grid;gap:48px;grid-template-columns:1fr}
  @media(min-width:768px){.foot-grid{grid-template-columns:1fr 1fr 1fr 1fr}}
  footer h3{font-size:1.5rem;letter-spacing:.2em;text-transform:uppercase;margin-bottom:16px}
  footer ul{list-style:none}
  footer ul li{margin-bottom:12px;font-size:.875rem}
  footer ul li a{transition:color .3s}
  footer ul li a:hover{color:var(--primary)}
  .foot-bottom{text-align:center;margin-top:40px;font-size:.75rem;color:var(--muted-foreground);letter-spacing:.05em}

  /* BOOKING MODAL */
  .modal-overlay{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(0,0,0,.5);backdrop-filter:blur(4px)}
  .modal-box{background:var(--background);width:100%;max-width:32rem;max-height:90vh;overflow-y:auto;padding:40px;position:relative}
  @media(min-width:768px){.modal-box{padding:40px}}
  .modal-close{position:absolute;top:20px;right:20px;padding:8px;background:none;border:0;color:var(--foreground);transition:color .3s}
  .modal-close:hover{color:var(--primary)}
  .modal-box .mlabel{display:flex;align-items:center;gap:8px;margin-bottom:12px}
  .modal-box select,.modal-box input[type=date],.modal-box textarea{width:100%;background:var(--secondary);border:1px solid var(--border);padding:12px 16px;font-size:.875rem;color:var(--foreground);outline:none}
  .modal-box select:focus,.modal-box input:focus,.modal-box textarea:focus{border-color:var(--primary)}
  .modal-box textarea{resize:none}
  .slots{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
  .slot{font-size:.75rem;padding:10px 0;border:1px solid var(--border);background:transparent;color:var(--foreground);transition:all .3s}
  .slot:hover{border-color:var(--primary)}
  .slot.active{background:var(--primary);color:var(--primary-foreground);border-color:var(--primary)}
  .confirm-check{text-align:center;padding:64px 0}
  .confirm-check .cc-ico{width:64px;height:64px;margin:0 auto 24px;border-radius:50%;background:color-mix(in srgb,var(--primary) 10%,transparent);display:flex;align-items:center;justify-content:center;color:var(--primary)}

  .page{padding-top:128px;padding-bottom:96px}
  .hidden{display:none}
  .pt-32{padding-top:128px}
  .pulse{background:var(--secondary);animation:pulse 2s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
  .line-clamp-2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .mb-12{margin-bottom:48px}
  .mb-8{margin-bottom:32px}
  .mt-12{margin-top:48px}
  .text-center{text-align:center}
  .order-1{order:1}
  .order-2{order:2}
  @media(min-width:768px){.md-order-1{order:1}.md-order-2{order:2}}
</style>
</head>
<body>

<header class="nav" id="navbar">
  <div class="nav-inner">
    <a href="#/" class="brand">
      <img src="JM._2.png" alt="Jéssica Martins - Exclusive Salon" class="brand-logo" />
    </a>
    <nav class="nav-links" id="navLinks">
      <a href="#/" data-route="/">Início</a>
      <a href="#/salao" data-route="/salao">O Salão</a>
      <a href="#/procedimentos" data-route="/procedimentos">Procedimentos</a>
      <a href="#/loja" data-route="/loja">Loja</a>
      <a href="#/contato" data-route="/contato">Contato</a>
    </nav>
    <div class="nav-right">
      <a href="#/carrinho" class="cart-link" aria-label="Carrinho">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
        <span class="cart-count hidden" id="cartCount">0</span>
      </a>
      <button class="burger" id="burger" aria-label="Menu">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><line x1="4" x2="20" y1="6" y2="6"/><line x1="4" x2="20" y1="12" y2="12"/><line x1="4" x2="20" y1="18" y2="18"/></svg>
      </button>
    </div>
  </div>
  <div class="mobile-menu" id="mobileMenu">
    <div class="mm-inner">
      <a href="#/" data-route="/">Início</a>
      <a href="#/salao" data-route="/salao">O Salão</a>
      <a href="#/procedimentos" data-route="/procedimentos">Procedimentos</a>
      <a href="#/loja" data-route="/loja">Loja</a>
      <a href="#/contato" data-route="/contato">Contato</a>
    </div>

function saveCart(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(cart)); }
function cartCount(){ return cart.length; }
function cartTotal(){ return cart.filter(i=>i.type==='product').reduce((s,i)=>s+i.price*i.quantity,0); }

function addServiceToCart(service, booking){
  cart.push({
    cartId: 'svc_'+Date.now()+'_'+Math.random().toString(36).slice(2,7),
    type:'service', id:service.id, name:service.name, price:service.price,
    professional: booking.professional||'', date: booking.date||'', time: booking.time||'', notes: booking.notes||''
  });
  saveCart(); updateCartBadge();
}
function addProductToCart(product){
  const ex = cart.find(i=>i.type==='product'&&i.id===product.id);
  if(ex){ ex.quantity++; } else {
    cart.push({cartId:'prd_'+Date.now()+'_'+Math.random().toString(36).slice(2,7),type:'product',id:product.id,name:product.name,brand:product.brand,price:product.price,image:product.image,quantity:1});
  }
  saveCart(); updateCartBadge(); toast('Adicionado ao carrinho');
}
function updateProductQty(cartId, qty){
  const it = cart.find(i=>i.cartId===cartId); if(it){ it.quantity = Math.max(1, qty); saveCart(); if(currentRoute==='/carrinho') render(); }
}
function removeCartItem(cartId){ cart = cart.filter(i=>i.cartId!==cartId); saveCart(); updateCartBadge(); if(currentRoute==='/carrinho') render(); }
function clearCartAll(){ cart = []; saveCart(); updateCartBadge(); if(currentRoute==='/carrinho') render(); }

function updateCartBadge(){
  const el = document.getElementById('cartCount');

  if(el) {
    el.textContent = c;
    el.classList.toggle('hidden', c===0);
  }
}

/* ============ TOAST ============ */
let toastTimer;
function toast(msg){
  let t = document.getElementById('toast');
  if(!t){ t = document.createElement('div'); t.id='toast'; t.style.cssText='position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--primary);color:var(--primary-foreground);padding:12px 24px;font-size:.85rem;font-weight:500;opacity:0;transition:.3s;z-index:200'; document.body.appendChild(t); }
  t.textContent = msg; t.style.opacity='1'; t.style.transform='translateX(-50%) translateY(0)';
  clearTimeout(toastTimer); toastTimer = setTimeout(()=>{ t.style.opacity='0'; t.style.transform='translateX(-50%) translateY(20px)'; }, 2200);
}
